name: nuripazu
description: ジェムパズル×動物育成の癒し系パズルゲーム。完成動物を育てて動物園を作ろう。
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Firebase
  firebase_core: ^2.24.0
  cloud_firestore: ^4.13.0
  firebase_auth: ^4.15.0
  cloud_functions: ^4.6.0
  firebase_analytics: ^10.6.0
  firebase_crashlytics: ^3.3.0
  firebase_remote_config: ^4.3.0

  # Monetization & Analytics
  revenue_cat_flutter: ^7.0.0
  google_mobile_ads: ^3.0.0

  # UI & Animation & Audio
  lottie: ^3.0.0
  google_fonts: ^6.1.0
  audioplayers: ^6.0.0

  # Localization & Formatting
  intl: ^0.19.0

  # Utilities
  uuid: ^4.0.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    # Images
    - assets/images/

    # Lottie Animations
    - assets/lottie/
    - assets/lottie/reactions/
    - assets/lottie/interactions/
    - assets/lottie/herd_bonus/
    - assets/lottie/special_poses/
    - assets/lottie/completion/

    # Sounds
    - assets/sounds/
    - assets/sounds/ui/
    - assets/sounds/affection/
    - assets/sounds/puzzle/
    - assets/sounds/bgm/
    - assets/sounds/animals/
    - assets/sounds/animals/animal_001/
    - assets/sounds/animals/animal_002/
    - assets/sounds/animals/animal_003/

  # Fonts
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/GoogleSans-Italic.ttf
          style: italic
